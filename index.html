<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Tracker v3</title>
    <style>
        body { margin: 0; background: #0b4e1c; color: white; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
        /* 1 columna fija para docenas (80px), 3 columnas iguales para números */
        #mesa { display: grid; grid-template-columns: 80px repeat(3, 1fr); grid-template-rows: auto repeat(12, 1fr) auto; gap: 2px; padding: 5px; flex-grow: 1; }
        
        .c { display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid #fff; cursor: pointer; font-weight: bold; min-height: 40px; }
        .zero { grid-column: span 4; background: #27ae60; font-size: 1.5em; }
        
        /* Aseguramos que los números ocupen solo 1 celda */
        .num-cell { grid-column: auto; }
        
        /* Docenas: Columna 1, filas 2 a 13 */
        #box-d0 { grid-column: 1; grid-row: 2 / span 4; }
        #box-d1 { grid-column: 1; grid-row: 6 / span 4; }
        #box-d2 { grid-column: 1; grid-row: 10 / span 4; }
        
        /* Columnas: Debajo de los números */
        #box-c0 { grid-column: 2; grid-row: 14; }
        #box-c1 { grid-column: 3; grid-row: 14; }
        #box-c2 { grid-column: 4; grid-row: 14; }

        .count-big { font-size: 1.2em; color: #ffff00; }
        .label-small { font-size: 0.7em; }
        .active-red { border: 3px solid #ff0000 !important; background: #581515 !important; }
        
        #stats { background: #000; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #fff; }
    </style>
</head>
<body>
    <div id="mesa">
        <div class="c zero" onclick="reg(0)">0</div>
        <!-- Docenas colocadas primero para asegurar el layout -->
        <div class="c" id="box-d0"><div class="count-big" id="cnt-d0">0</div><div class="label-small">1ª</div><div class="lvl-badge" id="lvl-d0"></div></div>
        <div class="c" id="box-d1"><div class="count-big" id="cnt-d1">0</div><div class="label-small">2ª</div><div class="lvl-badge" id="lvl-d1"></div></div>
        <div class="c" id="box-d2"><div class="count-big" id="cnt-d2">0</div><div class="label-small">3ª</div><div class="lvl-badge" id="lvl-d2"></div></div>
        
        <script>
            for(let i=1; i<=36; i++) {
                let col = ([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36].includes(i)) ? '#c0392b' : '#1a1a1a';
                document.write(`<div class="c num-cell" style="background:${col}" onclick="reg(${i})">${i}</div>`);
            }
        </script>
        
        <div class="c" id="box-c0"><div class="label-small">C1</div><div class="count-big" id="cnt-c0">0</div><div class="lvl-badge" id="lvl-c0"></div></div>
        <div class="c" id="box-c1"><div class="label-small">C2</div><div class="count-big" id="cnt-c1">0</div><div class="lvl-badge" id="lvl-c1"></div></div>
        <div class="c" id="box-c2"><div class="label-small">C3</div><div class="count-big" id="cnt-c2">0</div><div class="lvl-badge" id="lvl-c2"></div></div>
    </div>
    <div id="stats">
        <div>Rondas: <b id="rounds">0</b></div>
        <div style="font-size: 1.2em;">Bal: <b id="balance">$0</b></div>
        <button onclick="res()">Reset</button>
    </div>
    <!-- ... (tu JS de lógica se mantiene igual aquí abajo) ... -->
    <script>
        // (Tu función reg, findTie y updateUI siguen igual)
    </script>
</body>
</html>
